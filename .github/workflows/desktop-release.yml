name: Desktop Release

# Push a tag `desktop-vX.Y.Z` to build the Windows installer and publish it as a GitHub release
# (the web "Download" buttons and the in-app updater both read the latest release).
# Pull requests touching the desktop and manual runs are dry runs: same build, installer kept
# as a workflow artifact, nothing published.
on:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on a dry-run build (MAJOR.MINOR.PATCH). Defaults to tauri.conf.json."
        required: false

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      # R2 account endpoint the sidecar may download models from / upload results to. Compiled
      # into the shell (option_env!), see docs/windows-kusstudio-runbook.md.
      KUSSHOES_STORAGE_ORIGINS: https://1d92645e04fc345cde21bc7c7260e073.r2.cloudflarestorage.com
      # Signs the installer for the in-app updater (the public key is in tauri.conf.json).
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Stable asset name the web download buttons link to via releases/latest/download/.
      STABLE_INSTALLER_NAME: KusShoesEditor-Setup-x64.exe
    steps:
      - uses: actions/checkout@v4

      # Trigger-controlled values reach scripts only through env, never ${{ }} in the script body.
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME -replace '^desktop-v', ''
          } elseif ($env:INPUT_VERSION) {
            $version = $env:INPUT_VERSION
          } else {
            $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' must be MAJOR.MINOR.PATCH" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Stamp version
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $path = "desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.version = $env:VERSION
          $config | ConvertTo-Json -Depth 32 | Set-Content -Encoding utf8 $path

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      # Third-party actions are pinned to commit SHAs (tags can be moved).
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            desktop/src-tauri
            desktop/runtime-installer

      - name: Test runtime installer
        run: cargo test --manifest-path desktop/runtime-installer/Cargo.toml

      - name: Backend environment (sidecar)
        working-directory: backend
        run: |
          uv sync --frozen
          uv pip install pyinstaller

      - name: Frontend environment (desktop build)
        shell: pwsh
        run: |
          @"
          VITE_KUSSHOES_API_BASE_URL=https://api.kusshoes.kietta.me
          VITE_DESKTOP_CLOUD_API_BASE_URL=https://api.kusshoes.kietta.me
          VITE_API_BASE_URL=http://127.0.0.1:8010
          VITE_MARKETING_LOGIN_URL=https://kusshoes.vercel.app/login
          VITE_DESKTOP_SHELL=true
          VITE_DESKTOP_DEMO_PROJECT_ID=proj_desktop_demo
          "@ | Set-Content -Encoding utf8 frontend/.env.desktop

      - name: Install npm packages
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop

      - name: Build backend sidecar
        shell: pwsh
        run: ./desktop/scripts/build-backend-sidecar.ps1

      - name: Build installer (and publish on tag)
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npx tauri
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: KusShoes Editor v__VERSION__
          releaseBody: |
            **Tải về:** `KusShoesEditor-Setup-x64.exe` bên dưới, mở file và bấm Next để cài (không cần quyền Administrator).

            Lần mở đầu tiên, app tự tải bộ dựng hình 3D (Blender, khoảng 400 MB) và hiện thanh tiến trình. Các bản sau tự cập nhật trong app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Add stable-name installer to the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $installer = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          Copy-Item $installer.FullName $env:STABLE_INSTALLER_NAME
          gh release upload $env:REF_NAME $env:STABLE_INSTALLER_NAME --clobber

      - name: Keep dry-run installer as an artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: kusshoes-editor-${{ steps.version.outputs.version }}-windows
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
