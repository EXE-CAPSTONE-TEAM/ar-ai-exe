name: Mobile Release

# Push a tag `mobile-vX.Y.Z` to build the signed Android APK and publish it as a GitHub release
# (the web "Download APK" button reads it; the same file is uploaded to APKPure by hand).
# Mobile releases are never marked "latest": releases/latest belongs to the desktop app, whose
# download link and in-app updater depend on it.
# Pull requests touching the app and manual runs are dry runs: same build, APK kept as a
# workflow artifact, nothing published.
on:
  push:
    tags: ["mobile-v*"]
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-release.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on a dry-run build (MAJOR.MINOR.PATCH). Defaults to pubspec.yaml."
        required: false

permissions:
  contents: write

concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      # SHA-256 of the release signing certificate (key/kusshoes-android-release.jks). APKPure
      # rejects updates signed with a different key, so a build signed with anything else
      # (e.g. the debug fallback) must never be published.
      RELEASE_CERT_SHA256: 6cd7bf778b9c281e928d5c0af4e6146500d70c3633a2fa33ac66a5927ec93dfd
      STABLE_APK_NAME: KusShoes-Android.apk
    steps:
      - uses: actions/checkout@v4

      # Trigger-controlled values reach scripts only through env, never ${{ }} in the script body.
      - name: Resolve version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            version="${REF_NAME#mobile-v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)"
          fi
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'; then
            echo "Version '$version' must be MAJOR.MINOR.PATCH with MINOR and PATCH below 100" >&2
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          # Android versionCode must grow with every release: MAJOR*10000 + MINOR*100 + PATCH.
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      # The Kotlin compile daemon fails on the runner while building Flutter's Gradle plugin
      # (":gradle:compileKotlin": NoSuchFileException .gradle/kotlin/sessions/*.salive).
      # Compiling in-process avoids the daemon's session files; set in GRADLE_USER_HOME so it
      # also applies to the included Flutter plugin build.
      - name: Gradle settings
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.compiler.execution.strategy=in-process" >> ~/.gradle/gradle.properties

      - name: Release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not available; the build would be debug-signed." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=upload-keystore.jks"
          } > android/key.properties

      - name: Build APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          flutter pub get
          flutter build apk --release -v --build-name "$VERSION" --build-number "$BUILD_NUMBER"

      - name: Verify release signature
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/apksigner" verify --print-certs "$apk" > signers.txt
          cat signers.txt
          actual=$(sed -n 's/.*certificate SHA-256 digest: //p' signers.txt | head -1)
          if [ "$actual" != "$RELEASE_CERT_SHA256" ]; then
            echo "APK is signed with $actual, not the release key $RELEASE_CERT_SHA256" >&2
            exit 1
          fi
          "$tools/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):" | tee badging.txt
          min_sdk=$(sed -n "s/^sdkVersion:'\([0-9]*\)'.*/\1/p" badging.txt)
          echo "min_sdk=$min_sdk" >> "$GITHUB_OUTPUT"
          mkdir -p ../dist
          cp "$apk" "../dist/KusShoes-$VERSION.apk"
          cp "$apk" "../dist/$STABLE_APK_NAME"
          (cd ../dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish release
        if: github.ref_type == 'tag'
        working-directory: dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          MIN_SDK: ${{ steps.apk.outputs.min_sdk }}
        run: |
          notes="Ứng dụng quét giày KusShoes cho Android (APK đã ký bằng khoá release).

          - Tải: \`$STABLE_APK_NAME\` (hoặc \`KusShoes-$VERSION.apk\`), mở file để cài. Nếu Android hỏi, cho phép cài ứng dụng từ nguồn này.
          - Yêu cầu: Android API $MIN_SDK trở lên.
          - Mã kiểm tra SHA-256: xem \`SHA256SUMS.txt\`."
          gh release create "$REF_NAME" "KusShoes-$VERSION.apk" "$STABLE_APK_NAME" SHA256SUMS.txt \
            --verify-tag --latest=false --title "KusShoes Android v$VERSION" --notes "$notes"

      - name: Keep dry-run APK as an artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: kusshoes-android-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
