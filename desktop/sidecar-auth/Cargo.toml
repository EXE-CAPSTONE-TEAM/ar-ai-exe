[package]
name = "sidecar-auth"
version = "0.1.0"
edition = "2021"
description = "Trust-boundary logic between the KusStudio desktop shell and its local sidecar (KusShoes spec §F). No Tauri dependency, so it builds and tests on any host."
publish = false

[dependencies]
# Versions match what tauri already resolves (desktop/src-tauri/Cargo.lock) to avoid duplicates.
getrandom = "0.2"
hex = "0.4"
hmac = "0.12"
serde_json = "1"
sha2 = "0.10"
